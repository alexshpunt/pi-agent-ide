# yamllint disable rule:line-length rule:comments rule:document-start rule:truthy
name: GitHub issues to Linear

on:
  issues:
    types: [opened]

permissions:
  contents: read

concurrency:
  group: linear-github-issue-${{ github.event.issue.id }}
  cancel-in-progress: false

jobs:
  create-linear-issue:
    if: github.repository == 'alexshpunt/pi-agent-ide'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.19.0"
          package-manager-cache: false
      - name: Create or reuse the Linear issue
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
        run: node --experimental-strip-types scripts/github-issue-to-linear.ts
