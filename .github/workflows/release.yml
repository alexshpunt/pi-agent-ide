name: Publish to npm

on:
  push:
    tags:
      - "v*"

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Setup pnpm
        run: npm install --global pnpm@11

      - name: Setup runtime tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes fd-find ripgrep
          sudo ln --symbolic --force /usr/bin/fdfind /usr/local/bin/fd
          npm install --global @ast-grep/cli@0.45.1 eslint_d@15.0.2

      - name: Verify tag and public branch
        shell: bash
        run: |
          set -euo pipefail

          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          package_version="$(node -p "require('./package.json').version")"

          if [[ "$tag" != "v$package_version" ]]; then
            echo "Tag $tag does not match package.json version $package_version"
            exit 1
          fi

          if [[ "$(git cat-file -t "$tag")" != "tag" ]]; then
            echo "Release tag $tag must be annotated"
            exit 1
          fi

          git fetch origin main
          tag_commit="$(git rev-list -n 1 "$tag")"

          if ! git merge-base --is-ancestor "$tag_commit" origin/main; then
            echo "Tagged commit is not contained in public main"
            exit 1
          fi

          echo "Validated pi-agent-ide@$version"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check source and package
        run: pnpm check

      - name: Run unit tests
        run: pnpm test:unit

      - name: Run integration tests
        run: pnpm test:integration

  publish:
    name: Publish package
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@v6

      - name: Setup Node and npm registry
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Setup npm and pnpm
        run: npm install --global npm@11 pnpm@11

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build public package
        run: pnpm package:public

      - name: Publish generated tarball
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t tarballs < <(
            find .agents/tmp/public-package \
              -maxdepth 1 \
              -type f \
              -name 'pi-agent-ide-*.tgz' \
              -print
          )

          if [[ "${#tarballs[@]}" -ne 1 ]]; then
            echo "Expected one public package tarball, found ${#tarballs[@]}"
            exit 1
          fi

          npm publish "${tarballs[0]}" --access public --provenance
