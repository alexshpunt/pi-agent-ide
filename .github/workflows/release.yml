name: Publish to npm

on:
  workflow_dispatch:
    inputs:
      pull_request:
        description: Merged release PR number
        required: true
        type: string
      candidate_run:
        description: Successful CI run for the release PR
        required: true
        type: string
      publish:
        description: Publish after verifying the candidate (requires npm approval)
        default: false
        type: boolean

concurrency:
  group: npm-release
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

env:
  NODE_VERSION: "24.19.0"
  NPM_VERSION: "11.19.0"

jobs:
  validate:
    name: Verify candidate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.candidate.outputs.version }}
      commit: ${{ steps.candidate.outputs.commit }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: Verify candidate identity and archive
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PR: ${{ inputs.pull_request }}
          CANDIDATE_RUN: ${{ inputs.candidate_run }}
        run: node --experimental-strip-types scripts/promote-release.ts
      - name: Retain verified artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ steps.candidate.outputs.version }}
          path: .agents/tmp/promoted-release/*
          if-no-files-found: error
          compression-level: 0

  publish:
    name: Publish package
    needs: validate
    if: inputs.publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: write
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Setup Node and npm registry
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - name: Install pinned npm
        run: npm install --global "npm@${NPM_VERSION}"
      - name: Download verified artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-${{ needs.validate.outputs.version }}
          path: .agents/tmp/promoted-release
      - name: Publish exact archive without replacing tags or versions
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          RELEASE_COMMIT: ${{ needs.validate.outputs.commit }}
        run: node --experimental-strip-types scripts/publish-candidate.ts
