# yamllint disable rule:line-length rule:comments rule:document-start rule:truthy
name: Publish to npm

on:
  workflow_dispatch:
    inputs:
      pull_request:
        description: Merged release PR number
        required: true
        type: string
      candidate_run:
        description: Successful CI run for the release PR
        required: true
        type: string
      publish:
        description: Publish after verifying the candidate (requires npm approval)
        default: false
        type: boolean

concurrency:
  group: npm-release
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

env:
  NODE_VERSION: "24.19.0"
  NPM_VERSION: "11.19.0"

jobs:
  validate:
    name: Verify candidate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.candidate.outputs.version }}
      commit: ${{ steps.candidate.outputs.commit }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: Verify candidate identity and archive
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PR: ${{ inputs.pull_request }}
          CANDIDATE_RUN: ${{ inputs.candidate_run }}
        run: node --experimental-strip-types scripts/promote-release.ts
      - name: Retain verified artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: release-${{ steps.candidate.outputs.version }}
          path: .agents/tmp/promoted-release/*
          if-no-files-found: error
          compression-level: 0

  publish:
    name: Publish package
    needs: validate
    if: inputs.publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: write
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Setup Node and npm registry
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - name: Install pinned npm
        run: npm install --global "npm@${NPM_VERSION}"
      - name: Download verified artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: release-${{ needs.validate.outputs.version }}
          path: .agents/tmp/promoted-release
      - name: Publish exact archive without replacing tags or versions
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          RELEASE_COMMIT: ${{ needs.validate.outputs.commit }}
        run: node --experimental-strip-types scripts/publish-candidate.ts
      - name: Create matching GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          tag="v${RELEASE_VERSION}"
          archive=".agents/tmp/promoted-release/pi-agent-ide-${RELEASE_VERSION}.tgz"
          gh release view "$tag" >/dev/null 2>&1 ||
            gh release create "$tag" "$archive" --verify-tag --generate-notes --title "Pi Agent IDE ${RELEASE_VERSION}"

  benchmark:
    name: Benchmark published package
    needs: [validate, publish]
    if: inputs.publish && needs.publish.result == 'success'
    permissions:
      actions: read
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
    uses: alexshpunt/explicit-edit-benchmark/.github/workflows/official-run.yml@be568216c66a22149a1d869724ee3f2891b70988
    with:
      adapter: pi-agent-ide
      agent_version: "0.84.2"
      harness_version: ${{ needs.validate.outputs.version }}
      model: gpt-5.6-luna
      thinking: low
      concurrency: "10"
    secrets:
      pi_auth_json: ${{ secrets.PI_AUTH_JSON }}

  benchmark-submit:
    name: Submit official benchmark result
    needs: benchmark
    permissions:
      actions: read
      contents: read
    uses: alexshpunt/explicit-edit-benchmark/.github/workflows/official-submit.yml@0136a4d4e32b9cdf7f2924f18f9ffbab6c1839f8
    with:
      producer_run_id: ${{ github.run_id }}
      producer_attempt: ${{ github.run_attempt }}
      signer_sha: be568216c66a22149a1d869724ee3f2891b70988
      policy_sha: 0136a4d4e32b9cdf7f2924f18f9ffbab6c1839f8
      dataset_repository: alexshpunt/explicit-edit-benchmark
    secrets:
      hf_token: ${{ secrets.HF_TOKEN }}
