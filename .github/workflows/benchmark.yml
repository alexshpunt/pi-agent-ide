# yamllint disable rule:line-length rule:comments rule:document-start rule:truthy
name: Benchmark published package

on:
  workflow_dispatch:
    inputs:
      version:
        description: Published pi-agent-ide version or latest
        required: false
        default: latest
        type: string
  workflow_call:
    inputs:
      version:
        required: false
        default: latest
        type: string
    secrets:
      PI_AUTH_JSON:
        required: true
      HF_TOKEN:
        required: true

permissions:
  contents: read
  actions: read

jobs:
  resolve:
    name: Resolve published versions
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      agent_version: ${{ steps.versions.outputs.agent_version }}
      harness_version: ${{ steps.versions.outputs.harness_version }}
      policy_sha: ${{ steps.policy.outputs.policy_sha }}
      workflow_sha: ${{ steps.policy.outputs.workflow_sha }}
    steps:
      - name: Resolve npm tags to exact versions
        id: versions
        env:
          HARNESS_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          agent_version="$(npm view '@earendil-works/pi-coding-agent@latest' version)"
          if [[ "$HARNESS_VERSION" == "latest" ]]; then
            harness_version="$(npm view 'pi-agent-ide@latest' version)"
          else
            harness_version="$(npm view "pi-agent-ide@${HARNESS_VERSION}" version)"
          fi
          semver='^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'
          [[ "$agent_version" =~ $semver ]]
          [[ "$harness_version" =~ $semver ]]
          echo "agent_version=$agent_version" >> "$GITHUB_OUTPUT"
          echo "harness_version=$harness_version" >> "$GITHUB_OUTPUT"
          echo "Pi $agent_version; Pi Agent IDE $harness_version" >> "$GITHUB_STEP_SUMMARY"

      - name: Resolve current official benchmark policy
        id: policy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          workflow_sha="$(gh api 'repos/alexshpunt/explicit-edit-benchmark/git/ref/heads/official' --jq '.object.sha')"
          policy_sha="$(gh api 'repos/alexshpunt/explicit-edit-benchmark/commits?path=policies/official-runs/v1.json&sha=main&per_page=1' --jq '.[0].sha')"
          [[ "$workflow_sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$policy_sha" =~ ^[0-9a-f]{40}$ ]]
          echo "workflow_sha=$workflow_sha" >> "$GITHUB_OUTPUT"
          echo "policy_sha=$policy_sha" >> "$GITHUB_OUTPUT"
          echo "Official benchmark workflow $workflow_sha; policy $policy_sha" >> "$GITHUB_STEP_SUMMARY"

  benchmark:
    name: Run official benchmark
    needs: resolve
    permissions:
      actions: read
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
    uses: alexshpunt/explicit-edit-benchmark/.github/workflows/official-run.yml@official
    with:
      model: openai-codex/gpt-5.6-luna
      thinking: low
      task: ""
      concurrency: "10"
      adapter: pi-agent-ide
      agent_version: ${{ needs.resolve.outputs.agent_version }}
      harness_version: ${{ needs.resolve.outputs.harness_version }}
      runtime_version: ""
      provider: openai-codex
      policy_sha: ${{ needs.resolve.outputs.policy_sha }}
    secrets:
      pi_auth_json: ${{ secrets.PI_AUTH_JSON }}

  submit:
    name: Submit official benchmark result
    needs: [resolve, benchmark]
    permissions:
      actions: read
      contents: read
    uses: alexshpunt/explicit-edit-benchmark/.github/workflows/official-submit.yml@official
    with:
      producer_run_id: ${{ github.run_id }}
      producer_attempt: ${{ github.run_attempt }}
      signer_sha: ${{ needs.resolve.outputs.workflow_sha }}
      policy_sha: ${{ needs.resolve.outputs.policy_sha }}
      dataset_repository: alexshpunt/explicit-edit-benchmark
    secrets:
      hf_token: ${{ secrets.HF_TOKEN }}
