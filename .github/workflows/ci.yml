# yamllint disable rule:line-length rule:comments rule:document-start rule:truthy
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop, "release/*"]
  workflow_call:
    inputs:
      source_ref:
        description: Branch to validate in a reusable CI run
        type: string
        default: ""
      nightly:
        description: Retain an installable nightly package
        type: boolean
        default: false

permissions:
  contents: read
  checks: write
  actions: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24.19.0"
  NPM_VERSION: "11.19.0"
  PNPM_VERSION: "11.22.0"
  BADGE_GIST_ID: "0d28d39557e2a9976c4548e7737c102d"
  BADGE_TOKEN: ${{ secrets.GIST_TOKEN }}

jobs:
  windows-image:
    name: Inspect Windows runner image
    runs-on: windows-latest
    timeout-minutes: 5
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - name: Read runner image
        id: image
        shell: pwsh
        run: |
          $image = ''
          if ($env:ImageOS -and $env:ImageVersion) {
            $image = "$($env:ImageOS)/$($env:ImageVersion)"
          }
          "image=$image" >> $env:GITHUB_OUTPUT

  plan:
    name: Plan CI
    needs: windows-image
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      full: ${{ steps.decision.outputs.full }}
      source_run: ${{ steps.decision.outputs.source_run }}
      reason: ${{ steps.decision.outputs.reason }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: Decide whether full checks are needed
        id: decision
        env:
          GH_TOKEN: ${{ github.token }}
          CI_WINDOWS_IMAGE: ${{ needs.windows-image.outputs.image }}
          CI_NIGHTLY: ${{ inputs.nightly }}
        run: node --experimental-strip-types scripts/ci-evidence-action.ts decide

  validate:
    name: Validate
    needs: plan
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 45

    outputs:
      image: ${{ steps.identity.outputs.image }}
      commit: ${{ steps.identity.outputs.commit }}
      tree: ${{ steps.identity.outputs.tree }}
    steps:
      - name: Require a valid CI plan
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          RUN_FULL: ${{ needs.plan.outputs.full }}
          CI_EVENT: ${{ github.event_name }}
          CI_NIGHTLY: ${{ inputs.nightly }}
        run: |
          set -euo pipefail
          test "$PLAN_RESULT" = success
          test "$RUN_FULL" = true || test "$RUN_FULL" = false
          if [[ "$CI_EVENT" != push || "$CI_NIGHTLY" == true ]]; then
            test "$RUN_FULL" = true
          fi

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Capture tested Linux identity
        id: identity
        run: node --experimental-strip-types scripts/ci-evidence-action.ts identity

      - name: Enforce main release freeze
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        env:
          PR_HEAD: ${{ github.head_ref }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: node --experimental-strip-types scripts/release/merge-policy.ts

      - name: Scan commit range
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
            if [[ -z "$base" || "$base" =~ ^0+$ ]]; then base="HEAD^"; fi
          fi
          node --experimental-strip-types scripts/security-scan.ts range "$base" HEAD

      - name: Setup Linux tests
        if: needs.plan.outputs.full == 'true'
        uses: ./.github/actions/setup-linux-tests

      - name: Check source and package
        if: needs.plan.outputs.full == 'true'
        run: pnpm check

      - name: Verify public tree and package artifact
        if: needs.plan.outputs.full == 'true'
        shell: bash
        run: |
          set -euo pipefail
          pnpm security:scan -- tree .
          tarball="$(find .agents/tmp/public-package -maxdepth 1 -type f -name 'pi-agent-ide-*.tgz' -print -quit)"
          test -n "$tarball"
          pnpm security:scan -- artifact "$tarball"

      - name: Run unit tests
        if: needs.plan.outputs.full == 'true'
        id: unit-tests
        run: pnpm test:unit:report

      - name: Upload unit test report
        if: needs.plan.outputs.full == 'true' && (always() && hashFiles('.agents/tmp/test-results/unit.xml') != '')
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: unit-test-results
          path: .agents/tmp/test-results/unit.xml
          if-no-files-found: error
          retention-days: 30

      - name: Report unit tests
        id: unit-report
        if: needs.plan.outputs.full == 'true' && (always() && hashFiles('.agents/tmp/test-results/unit.xml') != '')
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        with:
          name: Unit tests
          path: .agents/tmp/test-results/unit.xml
          reporter: java-junit
          fail-on-error: false

      - name: Verify normal configured startup
        if: needs.plan.outputs.full == 'true' && (success())
        run: |
          pnpm exec pi install --approve --local "$GITHUB_WORKSPACE"
          pnpm exec oxnode scripts/dev/check-normal-startup.ts src/pi-agent-ide.ts

      - name: Capture agent interface
        if: needs.plan.outputs.full == 'true' && (success())
        run: >-
          pnpm dev:export-agent-interface --
          --transport rpc
          --tools read,search,select,diff,write,replace,insert,delete,copy,move,undo,bash,codemode,tool_search

      - name: Retain agent interface
        if: needs.plan.outputs.full == 'true' && (always() && hashFiles('.tmp/prompt-snapshots/*.md') != '')
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: agent-interface
          path: .tmp/prompt-snapshots/*.md
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

      - name: Smoke test nightly package
        if: needs.plan.outputs.full == 'true' && (success() && inputs.nightly)
        shell: bash
        run: |
          set -euo pipefail
          archive="$(find .agents/tmp/public-package -maxdepth 1 -type f -name 'pi-agent-ide-*.tgz' -print -quit)"
          test -n "$archive"
          node --experimental-strip-types --input-type=module -e 'import { installTestPackage, verifyInstalledPackage } from "./scripts/release-candidate.ts"; installTestPackage(".agents/tmp/nightly-install", process.argv[1]); verifyInstalledPackage(".agents/tmp/nightly-install");' "$archive"

      - name: Retain nightly package
        if: needs.plan.outputs.full == 'true' && (success() && inputs.nightly)
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: nightly-package
          path: .agents/tmp/public-package/pi-agent-ide-*.tgz
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Build and install reproducible release candidate
        if: needs.plan.outputs.full == 'true' && (success() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'release/') && github.base_ref == 'main')
        run: node --experimental-strip-types scripts/build-release-candidate.ts

      - name: Retain release candidate
        if: needs.plan.outputs.full == 'true' && (success() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'release/') && github.base_ref == 'main')
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: release-candidate
          path: .agents/tmp/release-candidate/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Update unit badge
        if: needs.plan.outputs.full == 'true' && (always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && env.BADGE_TOKEN != '' && steps.unit-report.outcome == 'success')
        uses: Schneegans/dynamic-badges-action@28b0fa8bdeb46170ac397105ece0c1fe58f68910 # v1.9.0
        with:
          auth: ${{ secrets.GIST_TOKEN }}
          gistID: ${{ env.BADGE_GIST_ID }}
          filename: unit.json
          label: unit
          message: ${{ steps.unit-report.outputs.passed }} passed · ${{ steps.unit-report.outputs.failed }} failed · ${{ steps.unit-report.outputs.skipped }} skipped
          color: ${{ steps.unit-report.outputs.failed == '0' && 'brightgreen' || 'red' }}
          isError: ${{ steps.unit-report.outputs.failed != '0' }}

  integration:
    name: Integration shard ${{ matrix.shard }}/4
    needs: plan
    if: always() && !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      PI_DEBUGGER_CORE_EXCLUDE_ADAPTER: kotlin
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.source_ref || github.ref }}

      - name: Setup Linux tests
        uses: ./.github/actions/setup-linux-tests

      - name: Run integration shard
        run: bash scripts/test-integration-ci.sh "${{ matrix.shard }}/4"

      - name: Upload integration shard logs
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: integration-shard-logs-${{ matrix.shard }}
          path: .tmp/integration-ci/*.log
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30

      - name: Upload integration report
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: integration-test-results-${{ matrix.shard }}
          path: .agents/tmp/test-results/integration-*.xml
          if-no-files-found: warn
          retention-days: 30

      - name: Retain editor TUI traces
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: editor-tui-traces-${{ matrix.shard }}
          path: |
            .tmp/test-runs/tests/integration/native-codemode.integration.test.ts/**/run.jsonl
            .tmp/test-runs/tests/integration/native-codemode.integration.test.ts/**/tui-rendered.log
            .tmp/test-runs/tests/integration/native-nested-rendering.integration.test.ts/**/run.jsonl
            .tmp/test-runs/tests/integration/native-nested-rendering.integration.test.ts/**/tui-rendered.log
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 30

      - name: Retain failed anchor Pi traces
        if: failure()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: failed-anchor-pi-traces-${{ matrix.shard }}
          path: .tmp/test-runs/tests/integration/extensions/pi-agent-text-editor/plugins/pi-agent-text-anchor-exact/anchor-tools.integration.test.ts/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30

      - name: Retain failed native Codemode Pi traces
        if: failure()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: failed-native-codemode-pi-traces-${{ matrix.shard }}
          path: .tmp/test-runs/tests/integration/native-codemode.integration.test.ts/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30

      - name: Retain failed semantic rename Pi traces
        if: failure()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: failed-semantic-rename-pi-traces-${{ matrix.shard }}
          path: .tmp/test-runs/tests/integration/capability-semantic-rename.integration.test.ts/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
      - name: Retain failed composition Pi traces
        if: failure()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: failed-composition-pi-traces-${{ matrix.shard }}
          path: .tmp/test-runs/tests/integration/native-tool-composition.integration.test.ts/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30

  integration-namespaces:
    name: Integration SSH namespaces
    needs: plan
    if: always() && !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.source_ref || github.ref }}

      - name: Setup Linux tests
        uses: ./.github/actions/setup-linux-tests

      - name: Prepare unprivileged SSH account
        run: |
          sudo useradd --create-home --shell /bin/bash agent
          sudo passwd --delete agent
          sudo mkdir --parents "$RUNNER_TEMP/namespace-home"

      - name: Run namespace integration tests
        shell: bash
        run: |
          set -euo pipefail
          environment=()
          for variable in "${!PI_@}"; do environment+=("$variable=${!variable}"); done
          sudo env "PATH=$PATH" "HOME=$RUNNER_TEMP/namespace-home" "${environment[@]}" \
            GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=safe.directory "GIT_CONFIG_VALUE_0=$GITHUB_WORKSPACE" \
            bash scripts/test-integration-ci.sh namespaces

      - name: Upload integration shard logs
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: integration-shard-logs-namespaces
          path: .tmp/integration-ci/*.log
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30

      - name: Upload integration report
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: integration-test-results-namespaces
          path: .agents/tmp/test-results/integration-*.xml
          if-no-files-found: warn
          retention-days: 30

  integration-report:
    name: Integration report
    needs: [plan, integration, integration-namespaces]
    if: always() && !cancelled() && needs.plan.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Download integration reports
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: integration-test-results-*
          path: .agents/tmp/test-results
          merge-multiple: true

      - name: Report integration tests
        id: integration-report
        if: always() && hashFiles('.agents/tmp/test-results/integration-*.xml') != ''
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        with:
          name: Integration tests
          path: .agents/tmp/test-results/integration-*.xml
          reporter: java-junit
          fail-on-error: false

      - name: Update integration badge
        if: needs.plan.outputs.full == 'true' && (always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && env.BADGE_TOKEN != '' && steps.integration-report.outcome == 'success')
        uses: Schneegans/dynamic-badges-action@28b0fa8bdeb46170ac397105ece0c1fe58f68910 # v1.9.0
        with:
          auth: ${{ secrets.GIST_TOKEN }}
          gistID: ${{ env.BADGE_GIST_ID }}
          filename: integration.json
          label: integration
          message: ${{ steps.integration-report.outputs.passed }} passed · ${{ steps.integration-report.outputs.failed }} failed · ${{ steps.integration-report.outputs.skipped }} skipped
          color: ${{ steps.integration-report.outputs.failed == '0' && 'brightgreen' || 'red' }}
          isError: ${{ steps.integration-report.outputs.failed != '0' }}

  record-evidence:
    name: Record full CI evidence
    needs:
      [
        plan,
        validate,
        validate-windows-core,
        integration,
        integration-namespaces,
        integration-report,
      ]
    if: always() && (github.event_name == 'push' || github.event_name == 'pull_request') && !inputs.nightly && needs.plan.outputs.full == 'true' && needs.validate.result == 'success' && needs['validate-windows-core'].result == 'success' && needs.integration.result == 'success' && needs['integration-namespaces'].result == 'success' && needs['integration-report'].result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout tested product
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.validate.outputs.commit }}
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: Record complete full-run proof
        id: record
        env:
          GH_TOKEN: ${{ github.token }}
          CI_FULL: ${{ needs.plan.outputs.full }}
          CI_LINUX_IMAGE: ${{ needs.validate.outputs.image }}
          CI_WINDOWS_IMAGE: ${{ needs.validate-windows-core.outputs.image }}
          CI_LINUX_TREE: ${{ needs.validate.outputs.tree }}
          CI_WINDOWS_TREE: ${{ needs.validate-windows-core.outputs.tree }}
        run: node --experimental-strip-types scripts/ci-evidence-action.ts record
      - name: Retain full-run proof
        if: steps.record.outputs.recorded == 'true'
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: ci-evidence-${{ github.run_attempt }}
          path: .agents/tmp/ci-evidence/evidence.json
          if-no-files-found: error
          retention-days: 30

  debugger-core:
    needs: plan
    if: always() && !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.full == 'true'
    name: Debugger core (flaky, non-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.source_ref || github.ref }}
      - name: Setup Linux tests
        uses: ./.github/actions/setup-linux-tests
      - name: Run flaky debugger integration
        env:
          PI_DEBUGGER_CORE_EXCLUDE_ADAPTER: kotlin
        run: >-
          env -u PI_INTEGRATION_TEST_RUNNER pnpm exec vitest run
          --config vitest.integration.config.mjs
          tests/integration/debugger*.integration.test.ts
          --reporter=default --reporter=junit
          --outputFile.junit=.tmp/debugger-results/core.xml
      - name: Retain flaky debugger results and Pi traces
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: flaky-debugger-core
          path: |
            .tmp/debugger-results/
            .tmp/test-runs/tests/integration/debugger*.integration.test.ts/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30

  validate-windows-core:
    needs: plan
    if: always() && !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.full == 'true'
    name: Validate Windows core
    outputs:
      image: ${{ steps.identity.outputs.image }}
      tree: ${{ steps.identity.outputs.tree }}
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.source_ref || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Capture tested Windows identity
        id: identity
        run: node --experimental-strip-types scripts/ci-evidence-action.ts identity

      - name: Setup npm and pnpm
        run: npm install --global "npm@$env:NPM_VERSION" "pnpm@$env:PNPM_VERSION"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Windows source contracts
        run: |
          pnpm typecheck
          pnpm vitest run src/api/path-identity.test.ts src/doctor/inventory.test.ts src/plugins/pi-agent-ide-debugger/tests

      - name: Verify Windows Pi 0.99.1 source and native tools
        shell: bash
        run: env -u PI_INTEGRATION_TEST_RUNNER pnpm exec vitest run --config vitest.integration.config.mjs tests/integration/native-host.integration.test.ts tests/integration/lazy-builtins.integration.test.ts

      - name: Verify Windows installed package and host boundaries
        shell: bash
        run: |
          set -euo pipefail
          pnpm check:package
          archive="$(find .agents/tmp/public-package -maxdepth 1 -type f -name 'pi-agent-ide-*.tgz' -print -quit)"
          test -n "$archive"
          node --experimental-strip-types --input-type=module -e 'import { installTestPackage, verifyInstalledPackage } from "./scripts/release-candidate.ts"; installTestPackage(".tmp/windows-install", process.argv[1]); verifyInstalledPackage(".tmp/windows-install");' "$archive"
          PI_AGENT_IDE_TEST_INSTALLATION="$(pwd)/.tmp/windows-install" env -u PI_INTEGRATION_TEST_RUNNER pnpm exec vitest run --config vitest.integration.config.mjs tests/integration/native-host.integration.test.ts

      - name: Retain Windows host traces
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: windows-host-traces
          path: |
            .tmp/test-runs/tests/integration/native-host.integration.test.ts/
            .tmp/test-runs/tests/integration/lazy-builtins.integration.test.ts/
          include-hidden-files: true
          if-no-files-found: ignore

      - name: Setup Windows native tools
        if: ${{ hashFiles('validation/language-toolchains/build-windows-checks.mjs') != '' }}
        shell: pwsh
        run: |
          python -m pip install debugpy==1.8.21
          npm install --global @ast-grep/cli@0.45.3
          $netcoreArchive = Join-Path $env:RUNNER_TEMP 'netcoredbg.zip'
          $netcoreRoot = Join-Path $env:RUNNER_TEMP 'netcoredbg'
          $netcoreUri = 'https://github.com/Samsung/netcoredbg/releases/download/' +
            '3.2.0-1092/netcoredbg-win64.zip'
          Invoke-WebRequest $netcoreUri -OutFile $netcoreArchive
          Expand-Archive $netcoreArchive $netcoreRoot -Force
          $netcore = Get-ChildItem $netcoreRoot -Recurse -Filter netcoredbg.exe |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $netcore) { throw 'netcoredbg.exe was not found' }
          $dartArchive = Join-Path $env:RUNNER_TEMP 'dart.zip'
          $dartRoot = Join-Path $env:RUNNER_TEMP 'dart'
          $dartUri = 'https://storage.googleapis.com/dart-archive/channels/stable/' +
            'release/3.13.3/sdk/dartsdk-windows-x64-release.zip'
          Invoke-WebRequest $dartUri -OutFile $dartArchive
          Expand-Archive $dartArchive $dartRoot -Force
          $dart = Get-ChildItem $dartRoot -Recurse -Filter dart.exe |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $dart) { throw 'dart.exe was not found' }
          $delveArchive = Join-Path $env:RUNNER_TEMP 'delve.zip'
          $delveRoot = Join-Path $env:RUNNER_TEMP 'delve'
          $delveUri = 'https://github.com/go-delve/delve/releases/download/' +
            'v1.27.2/dlv_1.27.2_windows_amd64.zip'
          Invoke-WebRequest $delveUri -OutFile $delveArchive
          Expand-Archive $delveArchive $delveRoot -Force
          $delve = Get-ChildItem $delveRoot -Recurse -Filter dlv.exe |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $delve) { throw 'dlv.exe was not found' }
          $zigArchive = Join-Path $env:RUNNER_TEMP 'zig.zip'
          $zigRoot = Join-Path $env:RUNNER_TEMP 'zig'
          $zigUri = 'https://ziglang.org/download/0.15.2/' +
            'zig-x86_64-windows-0.15.2.zip'
          Invoke-WebRequest $zigUri -OutFile $zigArchive
          Expand-Archive $zigArchive $zigRoot -Force
          $zig = Get-ChildItem $zigRoot -Recurse -Filter zig.exe |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $zig) { throw 'zig.exe was not found' }
          $psesArchive = Join-Path $env:RUNNER_TEMP 'pses.zip'
          $psesRoot = Join-Path $env:RUNNER_TEMP 'pses'
          $psesUri = 'https://github.com/PowerShell/PowerShellEditorServices/' +
            'releases/download/v4.7.0/PowerShellEditorServices.zip'
          Invoke-WebRequest $psesUri -OutFile $psesArchive
          Expand-Archive $psesArchive $psesRoot -Force
          choco install lua --yes --no-progress
          $luaArchive = Join-Path $env:RUNNER_TEMP 'lua-debug.vsix'
          $luaRoot = Join-Path $env:RUNNER_TEMP 'lua-debug'
          $luaUri = 'https://open-vsx.org/api/tomblind/local-lua-debugger-vscode/' +
            '0.3.3/file/tomblind.local-lua-debugger-vscode-0.3.3.vsix'
          Invoke-WebRequest $luaUri -OutFile $luaArchive
          Expand-Archive $luaArchive $luaRoot -Force
          $luaAdapter = Get-ChildItem $luaRoot -Recurse -Filter debugAdapter.js |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $luaAdapter) { throw 'Lua debugAdapter.js was not found' }
          $archive = Join-Path $env:RUNNER_TEMP 'js-debug-dap.tar.gz'
          $adapterRoot = Join-Path $env:RUNNER_TEMP 'pi-debug-adapters'
          $uri = 'https://github.com/microsoft/vscode-js-debug/releases/download/' +
            'v1.117.0/js-debug-dap-v1.117.0.tar.gz'
          Invoke-WebRequest $uri -OutFile $archive
          New-Item -ItemType Directory -Force $adapterRoot | Out-Null
          tar -xzf $archive -C $adapterRoot
          $server = Get-ChildItem $adapterRoot -Recurse -Filter dapDebugServer.js |
            Select-Object -First 1 -ExpandProperty FullName
          if (-not $server) { throw 'dapDebugServer.js was not found' }
          "PI_JS_DEBUG_PATH=$server" | Out-File `
            -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $lldb = (Get-Command lldb-dap.exe -ErrorAction Stop).Source
          $clang = (Get-Command clang.exe -ErrorAction Stop).Source
          $clangxx = (Get-Command clang++.exe -ErrorAction Stop).Source
          "PI_LLDB_DAP_PATH=$lldb" | Out-File `
            -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PI_CLANG_PATH=$clang" | Out-File `
            -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PI_CLANGXX_PATH=$clangxx" | Out-File `
            -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $dotnet = (Get-Command dotnet.exe -ErrorAction Stop).Source
          "PI_NETCOREDBG_PATH=$netcore" | Out-File `
            -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PI_DOTNET_PATH=$dotnet" | Out-File `
            -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PI_DART_PATH=$dart" | Out-File `
            -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PI_DELVE_PATH=$delve" | Out-File `
            -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PI_ZIG_PATH=$zig" | Out-File `
            -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PI_POWERSHELL_EDITOR_SERVICES_PATH=$psesRoot" | Out-File `
            -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $lua = (Get-Command lua.exe -ErrorAction Stop).Source
          "PI_LUA_PATH=$lua" | Out-File `
            -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PI_LUA_DEBUG_PATH=$luaAdapter" | Out-File `
            -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run Windows AST checks
        if: ${{ hashFiles('validation/language-toolchains/build-windows-checks.mjs') != '' }}
        shell: pwsh
        run: |
          node validation/language-toolchains/build-windows-checks.mjs
          pnpm exec node .agents/tmp/windows-checks/windows-ast-check.mjs

      - name: Run flaky Windows debugger lifecycle
        if: ${{ hashFiles('validation/language-toolchains/build-windows-checks.mjs') != '' }}
        continue-on-error: true
        shell: pwsh
        run: node .agents/tmp/windows-checks/windows-debugger-check.mjs

  java-debugger-lifecycle:
    needs: plan
    if: always() && !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.full == 'true'
    name: Java debugger (${{ matrix.os }}, flaky, non-blocking)
    continue-on-error: true
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.source_ref || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Setup pinned JDK
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: "21.0.8+9.0.LTS"

      - name: Setup npm and pnpm
        run: npm install --global "npm@${NPM_VERSION}" "pnpm@${PNPM_VERSION}"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup SSH fixture tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes openssh-server
      - name: Provision pinned Java debugger
        run: node scripts/provision-java-debugger.ts ".tmp/java dependencies"

      - name: Verify Java source lifecycle and public Pi calls
        run: >-
          pnpm exec vitest run --config vitest.integration.config.mjs
          tests/integration/debugger-jvm-adapters.integration.test.ts
          tests/integration/debugger-java-native.integration.test.ts
          tests/integration/debugger-java-public.integration.test.ts

      - name: Verify SSH Java lifecycle
        if: runner.os == 'Linux'
        run: pnpm exec vitest run --config vitest.integration.config.mjs tests/integration/ssh-java-debugger.integration.test.ts
      - name: Verify installed Java debugger through public Pi calls
        # Windows public-Pi startup is quarantined; native Java lifecycle still runs above.
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          pnpm check:package
          archive="$(find .agents/tmp/public-package -maxdepth 1 -name 'pi-agent-ide-*.tgz' -print -quit)"
          test -n "$archive"
          node --input-type=module -e 'import { installTestPackage } from "./scripts/release-candidate.ts"; installTestPackage(".tmp/java candidate", process.argv[1]);' "$archive"
          node scripts/build-java-checks.ts ".tmp/java candidate"
          installation="$(node -p 'require("node:path").resolve(".tmp/java candidate")' | tr -d '\r')"
          PI_AGENT_IDE_TEST_INSTALLATION="$installation" pnpm exec vitest run --config vitest.integration.config.mjs tests/integration/debugger-java-public.integration.test.ts

      - name: Retain candidate Pi traces
        if: always() && runner.os != 'Windows'
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: java-debugger-${{ matrix.os }}
          path: |
            .tmp/test-runs/tests/integration/debugger-java-public.integration.test.ts/**/run.jsonl
            .tmp/test-runs/tests/integration/debugger-java-public.integration.test.ts/**/tui-rendered.log
            .tmp/test-runs/tests/integration/debugger-java-public.integration.test.ts/**/error.log
          include-hidden-files: true
          if-no-files-found: error

  debugger-matrix:
    needs: plan
    if: always() && !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.full == 'true'
    name: Debugger (${{ matrix.language }}, flaky, non-blocking)
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        language: [swift, zig, julia, kotlin, elixir, r]

    steps:
      - name: Checkout
        # actions/checkout v6
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ inputs.source_ref || github.sha }}

      - name: Setup Node
        # actions/setup-node v6
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Setup pinned Erlang and Elixir
        if: matrix.language == 'elixir'
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1
        with:
          otp-version: "25.3.2.21"
          elixir-version: "1.14.5"

      - name: Setup pinned R
        if: matrix.language == 'r'
        uses: r-lib/actions/setup-r@465b7d8e732ca3921382b1674c59bada9cbf3399 # v2
        with:
          r-version: "4.3.3"

      - name: Setup npm and pnpm
        run: |
          npm install --global \
            "npm@${NPM_VERSION}" \
            "pnpm@${PNPM_VERSION}"

      - name: Provision pinned debugger
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          if [[ "${{ matrix.language }}" == "swift" ]]; then
            sudo apt-get install --yes \
              binutils \
              libcurl4-openssl-dev \
              libedit2 \
              libncurses-dev \
              libpython3-dev \
              libsqlite3-0 \
              libxml2-dev \
              libz3-dev \
              zlib1g-dev
            swift_url="https://download.swift.org/swift-6.3.3-release"
            swift_url+="/ubuntu2404/swift-6.3.3-RELEASE"
            swift_url+="/swift-6.3.3-RELEASE-ubuntu24.04.tar.gz"
            curl --fail --location --silent --show-error \
              "$swift_url" \
              --output /tmp/swift.tar.gz
            sudo mkdir --parents /opt/swift
            sudo tar --extract --gzip \
              --file /tmp/swift.tar.gz \
              --directory /opt/swift \
              --strip-components=1
            echo "/opt/swift/usr/bin" >> "$GITHUB_PATH"
            echo "PI_SWIFTC_PATH=/opt/swift/usr/bin/swiftc" \
              >> "$GITHUB_ENV"
            echo "PI_LLDB_DAP_PATH=/opt/swift/usr/bin/lldb-dap" \
              >> "$GITHUB_ENV"
          elif [[ "${{ matrix.language }}" == "zig" ]]; then
            sudo apt-get install --yes lldb-18 xz-utils
            zig_url="https://ziglang.org/download/0.15.2"
            zig_url+="/zig-x86_64-linux-0.15.2.tar.xz"
            curl --fail --location --silent --show-error \
              "$zig_url" \
              --output /tmp/zig.tar.xz
            sudo mkdir --parents /opt/zig
            sudo tar --extract --xz \
              --file /tmp/zig.tar.xz \
              --directory /opt/zig \
              --strip-components=1
            echo "/opt/zig" >> "$GITHUB_PATH"
            echo "PI_ZIG_PATH=/opt/zig/zig" >> "$GITHUB_ENV"
            echo "PI_LLDB_DAP_PATH=$(command -v lldb-dap-18)" \
              >> "$GITHUB_ENV"
          elif [[ "${{ matrix.language }}" == "kotlin" ]]; then
            sudo apt-get install --yes unzip
            jdk_url="https://github.com/adoptium/temurin21-binaries/releases/download"
            jdk_url+="/jdk-21.0.8%2B9"
            jdk_url+="/OpenJDK21U-jdk_x64_linux_hotspot_21.0.8_9.tar.gz"
            curl --fail --location --silent --show-error \
              "$jdk_url" \
              --output /tmp/jdk.tar.gz
            sudo mkdir --parents /opt/jdk
            sudo tar --extract --gzip \
              --file /tmp/jdk.tar.gz \
              --directory /opt/jdk \
              --strip-components=1
            curl --fail --location --silent --show-error \
              https://github.com/fwcd/kotlin-debug-adapter/releases/download/0.4.4/adapter.zip \
              --output /tmp/kotlin-debug-adapter.zip
            sudo unzip -q \
              /tmp/kotlin-debug-adapter.zip \
              -d /opt/kotlin-debug-adapter
            echo "/opt/jdk/bin" >> "$GITHUB_PATH"
            echo "/opt/kotlin-debug-adapter/adapter/bin" >> "$GITHUB_PATH"
            echo "JAVA_HOME=/opt/jdk" >> "$GITHUB_ENV"
            echo "PI_JAVAC_PATH=/opt/jdk/bin/javac" >> "$GITHUB_ENV"
            echo "PI_KOTLIN_DEBUG_ADAPTER_PATH=/opt/kotlin-debug-adapter/adapter/bin/kotlin-debug-adapter" \
              >> "$GITHUB_ENV"
            if [[ "${{ matrix.language }}" == "kotlin" ]]; then
              kotlin_url="https://github.com/JetBrains/kotlin/releases/download"
              kotlin_url+="/v2.2.20/kotlin-compiler-2.2.20.zip"
              curl --fail --location --silent --show-error \
                "$kotlin_url" --output /tmp/kotlin-compiler.zip
              sudo unzip -q /tmp/kotlin-compiler.zip -d /opt/kotlin
              echo "/opt/kotlin/kotlinc/bin" >> "$GITHUB_PATH"
            fi
          elif [[ "${{ matrix.language }}" == "elixir" ]]; then
            mix local.hex --force
            elixir_ls_url="https://github.com/elixir-lsp/elixir-ls/releases/download"
            elixir_ls_url+="/v0.29.3/elixir-ls-v0.29.3.zip"
            curl --fail --location --silent --show-error \
              "$elixir_ls_url" \
              --output /tmp/elixir-ls.zip
            echo "c07680593973ee9465e7361523b873baaacd258a4741342b1533bee5ac5c6c5e  /tmp/elixir-ls.zip" \
              | sha256sum --check
            sudo mkdir --parents /opt/pi-debug-adapters/elixir-ls
            sudo unzip -q /tmp/elixir-ls.zip \
              -d /opt/pi-debug-adapters/elixir-ls
            sudo chmod +x /opt/pi-debug-adapters/elixir-ls/debug_adapter.sh
            MIX_ENV=prod elixir \
              /opt/pi-debug-adapters/elixir-ls/quiet_install.exs \
              </dev/null >/dev/null
            echo "PI_ELIXIR_LS_DEBUG_PATH=/opt/pi-debug-adapters/elixir-ls/debug_adapter.sh" \
              >> "$GITHUB_ENV"
          elif [[ "${{ matrix.language }}" == "r" ]]; then
            sudo apt-get install --yes build-essential
            curl --fail --location --silent --show-error \
              https://cran.r-project.org/src/contrib/Archive/R6/R6_2.5.1.tar.gz \
              --output /tmp/R6_2.5.1.tar.gz
            curl --fail --location --silent --show-error \
              https://cran.r-project.org/src/contrib/Archive/jsonlite/jsonlite_1.8.8.tar.gz \
              --output /tmp/jsonlite_1.8.8.tar.gz
            curl --fail --location --silent --show-error \
              https://github.com/ManuelHentschel/vscDebugger/releases/download/v0.5.2/vscDebugger_0.5.2.tar.gz \
              --output /tmp/vscDebugger_0.5.2.tar.gz
            echo "8d92bd29c2ed7bf15f2778618ffe4a95556193d21d8431a7f75e7e5fc102bf48  /tmp/R6_2.5.1.tar.gz" \
              | sha256sum --check
            echo "7de21316984c3ba3d7423d12f43d1c30c716007c5e39bf07e11885e0ceb0caa4  /tmp/jsonlite_1.8.8.tar.gz" \
              | sha256sum --check
            echo "78a8f94f3f0e3ab267594b3fdc57be42f8e124d7737f4d61292e2a95642434dd  /tmp/vscDebugger_0.5.2.tar.gz" \
              | sha256sum --check
            sudo "$(command -v R)" CMD INSTALL /tmp/R6_2.5.1.tar.gz
            sudo "$(command -v R)" CMD INSTALL /tmp/jsonlite_1.8.8.tar.gz
            sudo "$(command -v R)" CMD INSTALL /tmp/vscDebugger_0.5.2.tar.gz
            echo "PI_R_PATH=$(command -v R)" >> "$GITHUB_ENV"
          else
            julia_url="https://julialang-s3.julialang.org"
            julia_url+="/bin/linux/x64/1.13"
            julia_url+="/julia-1.13.0-linux-x86_64.tar.gz"
            curl --fail --location --silent --show-error \
              "$julia_url" \
              --output /tmp/julia.tar.gz
            sudo mkdir --parents \
              /opt/julia \
              /opt/pi-debug-adapters/julia
            sudo tar --extract --gzip \
              --file /tmp/julia.tar.gz \
              --directory /opt/julia \
              --strip-components=1
            sudo chown -R "$USER" /opt/pi-debug-adapters/julia
            julia_setup='using Pkg; '
            julia_setup+='Pkg.add('
            julia_setup+='PackageSpec(name="DebugAdapter", version="3.2.1")'
            julia_setup+='); Pkg.precompile()'
            /opt/julia/bin/julia \
              --project=/opt/pi-debug-adapters/julia \
              --startup-file=no \
              -e "$julia_setup"
            echo "/opt/julia/bin" >> "$GITHUB_PATH"
            echo "PI_JULIA_PATH=/opt/julia/bin/julia" \
              >> "$GITHUB_ENV"
            echo "PI_JULIA_DEBUG_PROJECT=/opt/pi-debug-adapters/julia" \
              >> "$GITHUB_ENV"
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify native debugger
        env:
          PI_DEBUGGER_NATIVE_LANGUAGE: ${{ matrix.language }}
          PI_DEBUGGER_MISC_LANGUAGE: ${{ matrix.language }}
          PI_DEBUGGER_JVM_LANGUAGE: ${{ matrix.language }}
          PI_DEBUGGER_CORE_ADAPTER: ${{ matrix.language }}
        run: >-
          pnpm vitest run
          --config vitest.integration.config.mjs
          tests/integration/debugger-native-adapters.integration.test.ts
          tests/integration/debugger-misc-adapters.integration.test.ts
          tests/integration/debugger-jvm-adapters.integration.test.ts
          tests/integration/debugger-adapters.integration.test.ts
