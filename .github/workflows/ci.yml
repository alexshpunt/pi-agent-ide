name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Setup pnpm
        run: npm install --global pnpm@11

      - name: Setup runtime tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes fd-find ripgrep
          sudo ln --symbolic --force /usr/bin/fdfind /usr/local/bin/fd
          npm install --global @ast-grep/cli@0.45.1 eslint_d@15.0.2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check source and package
        run: pnpm check

      - name: Run unit tests
        run: pnpm test:unit

      - name: Run integration tests
        run: pnpm test:integration
