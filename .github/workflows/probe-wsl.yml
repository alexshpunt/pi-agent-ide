# Throwaway probe for LPT-1288; removed before the PR.
name: Probe WSL
on:
  push:
    branches: [lpt-1288-ssh-coverage-all-directions]
    paths: [.github/workflows/probe-wsl.yml]
jobs:
  probe:
    name: Probe
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Install Ubuntu (WSL 2)
        uses: Vampire/setup-wsl@e707f0b61a07f8ea48a64d83edfcbd4a7af45926 # v7.2.0
        with:
          distribution: Ubuntu-24.04
          wsl-version: 2
          additional-packages: openssh-server python3 git curl ca-certificates

      - name: Windows sshd as a plain process
        shell: pwsh
        continue-on-error: true
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'sshd-a'
          New-Item -ItemType Directory $root | Out-Null
          ssh-keygen -q -t ed25519 -N "" -f "$root\host"
          ssh-keygen -q -t ed25519 -N "" -f "$root\client"
          Copy-Item "$root\client.pub" "$root\authorized_keys"
          $fwd = $root -replace '\\','/'
          @"
          Port 2223
          ListenAddress 127.0.0.1
          HostKey $fwd/host
          PidFile $fwd/sshd.pid
          AuthorizedKeysFile $fwd/authorized_keys
          StrictModes no
          PasswordAuthentication no
          LogLevel DEBUG1
          "@ -split "`n" | ForEach-Object { $_.Trim() } | Set-Content "$root\sshd_config"
          $job = Start-Job { & C:\Windows\System32\OpenSSH\sshd.exe -d -e -f $using:root\sshd_config 2>&1 }
          Start-Sleep 3
          "job state: $($job.State)"
          ssh -i "$root\client" -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=NUL -o BatchMode=yes -p 2223 "$env:USERNAME@127.0.0.1" 'py -3 -c "import sys;print(sys.version)"'
          "ssh exit: $LASTEXITCODE"
          Start-Sleep 1
          "job state: $($job.State)"
          Receive-Job $job | Select-Object -Last 40
          Stop-Job $job

      - name: Windows sshd as a private service
        shell: pwsh
        continue-on-error: true
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'sshd-b'
          New-Item -ItemType Directory $root | Out-Null
          ssh-keygen -q -t ed25519 -N "" -f "$root\host"
          ssh-keygen -q -t ed25519 -N "" -f "$root\client"
          Copy-Item "$root\client.pub" "$root\authorized_keys"
          $fwd = $root -replace '\\','/'
          @"
          Port 2224
          ListenAddress 0.0.0.0
          HostKey $fwd/host
          PidFile $fwd/sshd.pid
          AuthorizedKeysFile $fwd/authorized_keys
          StrictModes no
          PasswordAuthentication no
          LogLevel DEBUG1
          SyslogFacility LOCAL0
          "@ -split "`n" | ForEach-Object { $_.Trim() } | Set-Content "$root\sshd_config"
          "SSHDIR=$root" >> $env:GITHUB_ENV
          $bin = '"C:\Windows\System32\OpenSSH\sshd.exe" -f "' + $root + '\sshd_config"'
          New-Service -Name pi-ide-sshd-probe -BinaryPathName $bin -StartupType Manual | Format-List Name,Status
          Start-Service pi-ide-sshd-probe
          Start-Sleep 3
          sc.exe query pi-ide-sshd-probe
          ssh -i "$root\client" -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=NUL -o BatchMode=yes -p 2224 "$env:USERNAME@127.0.0.1" 'py -3 -c "import sys;print(sys.version)"'
          "ssh exit: $LASTEXITCODE"
          New-NetFirewallRule -DisplayName pi-ide-sshd-probe -Direction Inbound -Protocol TCP -LocalPort 2224 -Action Allow | Out-Null
          "user: $env:USERNAME"

      - name: WSL reaches Windows sshd
        shell: pwsh
        continue-on-error: true
        run: |
          $key = "$env:SSHDIR\client" -replace '\\','/'
          $gw = (wsl -d Ubuntu-24.04 -u root -- ip route show default).Split(' ')[2]
          "gateway: $gw"
          $wslKey = (wsl -d Ubuntu-24.04 -u root -- wslpath -a "$key").Trim()
          wsl -d Ubuntu-24.04 -u root -- install -m600 "$wslKey" /tmp/k
          wsl -d Ubuntu-24.04 -u root -- ssh -i /tmp/k -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o BatchMode=yes -o ConnectTimeout=10 -p 2224 "$env:USERNAME@$gw" 'py -3 -c "import sys;print(sys.version)"'
          "ssh exit: $LASTEXITCODE"
