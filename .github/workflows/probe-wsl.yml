# Throwaway probe for LPT-1288; removed before the PR.
name: Probe WSL
on:
  push:
    branches: [lpt-1288-ssh-coverage-all-directions]
    paths: [.github/workflows/probe-wsl.yml]
jobs:
  probe:
    name: Probe
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Install Ubuntu (WSL 2)
        uses: Vampire/setup-wsl@e707f0b61a07f8ea48a64d83edfcbd4a7af45926 # v7.2.0
        with:
          distribution: Ubuntu-24.04
          wsl-version: 2
          additional-packages: openssh-server python3 git curl ca-certificates

      - name: Windows sshd reachable from WSL
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'sshd-a'
          New-Item -ItemType Directory $root | Out-Null
          ssh-keygen -q -t ed25519 -N "" -f "$root\host"
          ssh-keygen -q -t ed25519 -N "" -f "$root\client"
          Copy-Item "$root\client.pub" "$root\authorized_keys"
          $fwd = $root -replace '\\','/'
          $gw = (wsl -d Ubuntu-24.04 -u root -- ip route show default).Split(' ')[2]
          "gateway: $gw"
          Get-NetIPAddress -AddressFamily IPv4 | Format-Table InterfaceAlias,IPAddress
          Get-NetConnectionProfile | Format-Table Name,NetworkCategory,InterfaceAlias
          @"
          Port 2224
          ListenAddress 0.0.0.0
          HostKey $fwd/host
          PidFile $fwd/sshd.pid
          AuthorizedKeysFile $fwd/authorized_keys
          StrictModes no
          PasswordAuthentication no
          LogLevel DEBUG1
          "@ -split "`n" | ForEach-Object { $_.Trim() } | Set-Content "$root\sshd_config"
          New-NetFirewallRule -DisplayName pi-ide-sshd-probe -Direction Inbound -Protocol TCP -LocalPort 2224 -Action Allow -Profile Any | Out-Null
          $p = Start-Process -PassThru -WindowStyle Hidden -FilePath C:\Windows\System32\OpenSSH\sshd.exe -ArgumentList '-D','-e','-f',"$root\sshd_config" -RedirectStandardError "$root\sshd.err"
          Start-Sleep 3
          "alive: $(-not $p.HasExited)"
          netstat -an | Select-String ':2224'
          $key = "$root\client" -replace '\\','/'
          $wslKey = (wsl -d Ubuntu-24.04 -u root -- wslpath -a "$key").Trim()
          wsl -d Ubuntu-24.04 -u root -- install -m600 "$wslKey" /tmp/k
          wsl -d Ubuntu-24.04 -u root -- ssh -i /tmp/k -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o BatchMode=yes -o ConnectTimeout=10 -p 2224 "$env:USERNAME@$gw" 'py -3 -c "import sys;print(sys.version)"'
          "ssh exit: $LASTEXITCODE"
          Get-Content "$root\sshd.err" -Tail 20
          Stop-Process -Id $p.Id -Force
