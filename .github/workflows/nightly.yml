# yamllint disable rule:line-length rule:document-start rule:truthy
name: Develop nightly

on:
  # GitHub cron is UTC: Berlin midnight is 22:00 UTC in summer and 23:00 UTC in winter.
  schedule:
    - cron: "0 22 * * *"
    - cron: "0 23 * * *"
  workflow_dispatch:
    inputs:
      simulate_failure:
        description: Fail on purpose to test the failure issue and email; no branch is built.
        type: boolean
        default: false

permissions:
  # Must cover every permission the called CI workflow requests, or GitHub refuses to start the run.
  actions: read
  contents: read
  checks: write

concurrency:
  group: develop-nightly
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.develop.outputs.sha }}
    steps:
      - name: Simulate a nightly failure
        if: inputs.simulate_failure
        run: |
          echo '::error::Simulated nightly failure (workflow_dispatch input simulate_failure).'
          exit 1
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24.19.0"
          package-manager-cache: false
      - name: Check Berlin midnight and pin develop
        id: develop
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == schedule && "$(node --experimental-strip-types scripts/nightly-schedule.ts)" != true ]]; then
            echo 'Not Berlin midnight; the other UTC cron slot covers this date.'
            exit 0
          fi
          sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/develop" --jq '.object.sha')"
          test "${#sha}" -eq 40
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  ci:
    needs: resolve
    if: needs.resolve.outputs.sha != ''
    permissions:
      actions: read
      contents: read
      checks: write
    uses: ./.github/workflows/ci.yml
    with:
      source_ref: ${{ needs.resolve.outputs.sha }}
      nightly: true

  # Keeps one open "Develop nightly is failing" issue labeled `nightly` while nightlies fail:
  # a failed night opens it or comments on it, the next passing night closes it.
  # The run gate (`resolve` passing without a commit) and cancelled runs report nothing.
  report:
    needs: [resolve, ci]
    if: always() && (needs.resolve.result != 'success' || needs.resolve.outputs.sha != '')
    runs-on: ubuntu-latest
    permissions:
      actions: read
      issues: write
    steps:
      - name: Open, update or close the nightly issue
        env:
          GH_TOKEN: ${{ github.token }}
          RESOLVE_RESULT: ${{ needs.resolve.result }}
          CI_RESULT: ${{ needs.ci.result }}
          SIMULATED: ${{ inputs.simulate_failure == true }}
          SHA: ${{ needs.resolve.outputs.sha }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          run_url="$GITHUB_SERVER_URL/$repo/actions/runs/$GITHUB_RUN_ID"
          if [[ "$GITHUB_RUN_ATTEMPT" -gt 1 ]]; then run_url="$run_url/attempts/$GITHUB_RUN_ATTEMPT"; fi
          title='Develop nightly is failing'
          if [[ "$SIMULATED" == true ]]; then title="$title (simulated test)"; fi
          if [[ "$RESOLVE_RESULT" == success && "$CI_RESULT" == success ]]; then outcome=passed
          elif [[ "$RESOLVE_RESULT" == failure || "$CI_RESULT" == failure ]]; then outcome=failed
          else
            echo "Nothing to report: resolve=$RESOLVE_RESULT ci=$CI_RESULT."
            exit 0
          fi
          open_issue() {
            gh issue list --repo "$repo" --label nightly --state open --limit 100 --json number,title \
              --jq "map(select(.title == \"$1\")) | .[0].number // empty"
          }
          if [[ "$outcome" == passed ]]; then
            number="$(open_issue "$title")"
            if [[ -n "$number" ]]; then
              gh issue close "$number" --repo "$repo" --comment "Develop nightly passed again on \`develop\` ${SHA:0:12}: $run_url"
            fi
            exit 0
          fi
          gh label create nightly --repo "$repo" --color B60205 --description 'Develop nightly is failing' --force
          # shellcheck disable=SC2016 # jq string interpolation, not shell
          jobs="$(gh api "repos/$repo/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100" \
            --jq '.jobs[] | select(.conclusion == "failure" or .conclusion == "timed_out") | "- [\(.name)](\(.html_url))"')"
          body="$RUNNER_TEMP/nightly-issue.md"
          {
            if [[ "$SIMULATED" == true ]]; then
              echo 'This failure was simulated with the simulate_failure input to test the nightly alerts; no code was built.'
              echo
            fi
            echo "Develop nightly failed (${EVENT}${SHA:+, \`develop\` ${SHA:0:12}})."
            echo
            echo "Run: $run_url"
            echo
            echo 'Failed jobs:'
            echo "${jobs:-- none listed; see the run}"
            echo
            echo 'While this issue is open, each failed nightly adds a comment. The next passing nightly closes it.'
          } > "$body"
          number="$(open_issue "$title")"
          if [[ -n "$number" ]]; then
            gh issue comment "$number" --repo "$repo" --body-file "$body"
          else
            gh issue create --repo "$repo" --title "$title" --label nightly --body-file "$body"
          fi
