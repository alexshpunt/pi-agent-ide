packages:
  - "packages/*"
  - "src/extensions/**"
  - "src/plugins/*"
minimumReleaseAgeExclude:
  - "pi-coding-agent-test@0.1.1"
  - run@2.1.4

# node-fetch still depends on this deprecated compatibility shim.
allowedDeprecatedVersions:
  node-domexception: "1.0.0"

allowBuilds:
  "@ast-grep/lang-bash": true
  "@ast-grep/lang-csharp": true
  "@ast-grep/lang-dart": true
  "@ast-grep/lang-elixir": true
  "@ast-grep/lang-go": true
  "@ast-grep/lang-html": true
  "@ast-grep/lang-java": true
  "@ast-grep/lang-kotlin": true
  "@ast-grep/lang-lua": true
  "@ast-grep/lang-markdown": true
  "@ast-grep/lang-php": true
  "@ast-grep/lang-ruby": true
  "@ast-grep/lang-scala": true
  "@ast-grep/lang-sql": true
  "@ast-grep/lang-swift": true
  "@google/genai": true
  "@tree-sitter-grammars/tree-sitter-toml": true
  "@tree-sitter-grammars/tree-sitter-yaml": true
  better-sqlite3: true
  esbuild: true
  node-llama-cpp: true
  node-pty: true
  protobufjs: true
  tree-sitter-c: true
  tree-sitter-cpp: true
  tree-sitter-go: true
  tree-sitter-javascript: true
  tree-sitter-json: true
  tree-sitter-python: true
  tree-sitter-rust: true
  tree-sitter-typescript: true
  unrs-resolver: true
